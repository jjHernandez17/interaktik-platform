<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Minecraft Interactivo">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8f0"/>
      <stop offset="1" stop-color="#b9e4ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#sky)"/>
  <rect width="800" height="480" fill="url(#glow)"/>

  <!-- nubes de bloques -->
  <g fill="#fff" opacity=".85">
    <rect x="70" y="60" width="120" height="26"/><rect x="100" y="38" width="64" height="26"/>
    <rect x="560" y="96" width="140" height="26"/><rect x="590" y="74" width="72" height="26"/>
  </g>

  <!-- terreno -->
  <rect y="340" width="800" height="140" fill="#7a4e2b"/>
  <rect y="340" width="800" height="34" fill="#5fbf3a"/>
  <g fill="#4a9a2a">
    <rect x="30" y="340" width="40" height="12"/><rect x="150" y="340" width="52" height="12"/>
    <rect x="330" y="340" width="40" height="12"/><rect x="520" y="340" width="56" height="12"/>
    <rect x="700" y="340" width="40" height="12"/>
  </g>
  <g fill="#664023">
    <rect x="60" y="400" width="44" height="30"/><rect x="220" y="420" width="44" height="30"/>
    <rect x="410" y="395" width="44" height="30"/><rect x="600" y="425" width="44" height="30"/>
  </g>

  <!-- creeper -->
  <g transform="translate(110 188)">
    <rect width="96" height="96" fill="#4caf3d"/>
    <rect x="12" y="12" width="72" height="72" fill="#5ec94b" opacity=".5"/>
    <rect x="16" y="22" width="22" height="22" fill="#0e2a0b"/>
    <rect x="58" y="22" width="22" height="22" fill="#0e2a0b"/>
    <rect x="38" y="46" width="20" height="26" fill="#0e2a0b"/>
    <rect x="26" y="62" width="14" height="22" fill="#0e2a0b"/>
    <rect x="56" y="62" width="14" height="22" fill="#0e2a0b"/>
    <rect y="96" x="10" width="30" height="56" fill="#4caf3d"/>
    <rect y="96" x="56" width="30" height="56" fill="#4caf3d"/>
  </g>

  <!-- TNT -->
  <g transform="translate(330 232)">
    <rect width="108" height="108" fill="#d63a2f"/>
    <rect y="38" width="108" height="34" fill="#f3efe3"/>
    <text x="54" y="64" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#2a2a2a">TNT</text>
    <rect x="46" y="-14" width="16" height="14" fill="#6b4a2a"/>
    <rect x="52" y="-30" width="8" height="16" fill="#ffd54a"/>
  </g>

  <!-- regalo -->
  <g transform="translate(560 252)">
    <rect width="88" height="88" fill="#7c5cff"/>
    <rect x="36" width="16" height="88" fill="#ffd54a"/>
    <rect y="36" width="88" height="16" fill="#ffd54a"/>
    <rect x="22" y="-18" width="26" height="22" fill="#ffd54a"/>
    <rect x="40" y="-18" width="26" height="22" fill="#ffd54a"/>
  </g>

  <!-- chispas -->
  <g fill="#ffd54a">
    <rect x="300" y="196" width="10" height="10"/><rect x="452" y="214" width="8" height="8"/>
    <rect x="522" y="206" width="10" height="10"/><rect x="668" y="226" width="8" height="8"/>
  </g>
</svg>
