<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Pelea Callejera">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090913" />
      <stop offset="0.55" stop-color="#1b1033" />
      <stop offset="1" stop-color="#2a1230" />
    </linearGradient>
    <radialGradient id="clash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="1" />
      <stop offset="0.35" stop-color="#ffb300" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b" />
      <stop offset="1" stop-color="#c1121f" />
    </linearGradient>
    <linearGradient id="blue" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec1ff" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" /></filter>
  </defs>

  <rect width="600" height="800" fill="url(#sky)" />

  <!-- ciudad al fondo -->
  <g fill="#0d0b1e" opacity="0.9">
    <rect x="0" y="470" width="60" height="230" /><rect x="70" y="420" width="50" height="280" /><rect x="130" y="490" width="70" height="210" />
    <rect x="215" y="440" width="45" height="260" /><rect x="340" y="455" width="60" height="245" /><rect x="410" y="400" width="55" height="300" />
    <rect x="475" y="480" width="50" height="220" /><rect x="535" y="430" width="65" height="270" />
  </g>
  <g fill="#ffd166" opacity="0.55">
    <rect x="82" y="440" width="6" height="8" /><rect x="98" y="470" width="6" height="8" /><rect x="422" y="425" width="6" height="8" />
    <rect x="440" y="455" width="6" height="8" /><rect x="548" y="455" width="6" height="8" /><rect x="228" y="470" width="6" height="8" />
  </g>

  <!-- lineas de velocidad de cada lado -->
  <g stroke="#ff4d6d" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M10 250 L230 300" /><path d="M0 330 L210 360" /><path d="M20 560 L200 520" /><path d="M0 640 L170 590" />
  </g>
  <g stroke="#4cc9f0" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M590 250 L370 300" /><path d="M600 330 L390 360" /><path d="M580 560 L400 520" /><path d="M600 640 L430 590" />
  </g>

  <!-- choque central -->
  <circle cx="300" cy="360" r="190" fill="url(#clash)" />
  <polygon fill="#fffbe0" points="300,210 322,300 392,250 352,330 440,340 356,372 410,440 328,408 316,500 288,412 208,452 252,380 168,356 256,326 214,252 284,300" opacity="0.95" />
  <polygon fill="#ffb300" points="300,250 314,314 360,284 336,336 390,346 338,366 366,410 318,392 308,448 292,394 246,416 268,370 220,358 272,336 248,290 292,320" />

  <!-- luchador izquierdo (rojo) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M170 480 L128 575 L82 668" stroke="#14070a" stroke-width="40" />
    <path d="M170 480 L222 575 L238 672" stroke="#14070a" stroke-width="40" />
    <path d="M172 340 L164 478" stroke="#14070a" stroke-width="64" />
    <path d="M180 352 L338 332" stroke="#14070a" stroke-width="40" />
    <path d="M168 360 L112 408 L152 430" stroke="#14070a" stroke-width="36" />
    <path d="M170 480 L128 575 L82 668" stroke="url(#red)" stroke-width="30" />
    <path d="M170 480 L222 575 L238 672" stroke="url(#red)" stroke-width="30" />
    <path d="M172 340 L164 478" stroke="url(#red)" stroke-width="54" />
    <path d="M180 352 L338 332" stroke="url(#red)" stroke-width="30" />
    <path d="M168 360 L112 408 L152 430" stroke="url(#red)" stroke-width="26" />
  </g>
  <circle cx="338" cy="330" r="30" fill="#ffe3e3" stroke="#14070a" stroke-width="6" />
  <circle cx="172" cy="292" r="34" fill="#ffd9c2" stroke="#14070a" stroke-width="6" />
  <path d="M138 286 Q172 250 206 286 L206 276 Q172 238 138 276 Z" fill="#14070a" />

  <!-- luchador derecho (azul) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M430 480 L472 575 L518 668" stroke="#050a14" stroke-width="40" />
    <path d="M430 480 L378 575 L362 672" stroke="#050a14" stroke-width="40" />
    <path d="M428 340 L436 478" stroke="#050a14" stroke-width="64" />
    <path d="M420 352 L262 332" stroke="#050a14" stroke-width="40" />
    <path d="M432 360 L488 408 L448 430" stroke="#050a14" stroke-width="36" />
    <path d="M430 480 L472 575 L518 668" stroke="url(#blue)" stroke-width="30" />
    <path d="M430 480 L378 575 L362 672" stroke="url(#blue)" stroke-width="30" />
    <path d="M428 340 L436 478" stroke="url(#blue)" stroke-width="54" />
    <path d="M420 352 L262 332" stroke="url(#blue)" stroke-width="30" />
    <path d="M432 360 L488 408 L448 430" stroke="url(#blue)" stroke-width="26" />
  </g>
  <circle cx="262" cy="330" r="30" fill="#e3f2ff" stroke="#050a14" stroke-width="6" />
  <circle cx="428" cy="292" r="34" fill="#ffd9c2" stroke="#050a14" stroke-width="6" />
  <path d="M394 286 Q428 250 462 286 L462 276 Q428 238 394 276 Z" fill="#050a14" />

  <!-- piso con neon -->
  <rect x="0" y="672" width="600" height="128" fill="#12081c" />
  <rect x="0" y="668" width="600" height="8" fill="#ff2d55" />
  <rect x="0" y="676" width="600" height="60" fill="url(#floor)" opacity="0.5" />

  <!-- titulo -->
  <g font-family="Impact, 'Arial Black', 'Segoe UI', sans-serif" text-anchor="middle" font-weight="900">
    <text x="300" y="104" font-size="30" letter-spacing="10" fill="#ffd166" stroke="#14070a" stroke-width="2" paint-order="stroke">INTERAKTIK</text>
    <text x="300" y="196" font-size="84" fill="#ffffff" stroke="#c1121f" stroke-width="8" paint-order="stroke" letter-spacing="2">PELEA</text>
    <text x="300" y="752" font-size="62" fill="#ffffff" stroke="#1d4ed8" stroke-width="7" paint-order="stroke" letter-spacing="2">CALLEJERA</text>
  </g>
  <text x="300" y="790" font-family="'Arial Black', 'Segoe UI', sans-serif" font-size="15" font-weight="900" letter-spacing="6" text-anchor="middle" fill="#ffd166">TIKTOK LIVE · ROBLOX</text>
</svg>
