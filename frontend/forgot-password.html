<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olvide mi contrasena | Interaktik</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="assets/css/design-system.css" />
    <link rel="stylesheet" href="assets/css/bg-effects.css?v=20260922a" />
    <link rel="stylesheet" href="assets/css/auth.css?v=20260906a" />
  </head>
  <body>
    <div class="aurora-layer" aria-hidden="true">
      <span class="aurora-blob aurora-1"></span>
      <span class="aurora-blob aurora-2"></span>
      <span class="aurora-blob aurora-3"></span>
      <span class="shooting-star"></span>
      <span class="shooting-star"></span>
      <span class="shooting-star"></span>
      <span class="shooting-star"></span>
      <span class="shooting-star"></span>
      <span class="shooting-star"></span>
      <span class="shooting-star"></span>
      <div class="starfield-layer" data-depth="0.05">
        <div id="stars"></div>
      </div>
      <div class="starfield-layer" data-depth="0.12">
        <div id="stars2"></div>
      </div>
      <div class="starfield-layer" data-depth="0.22">
        <div id="stars3"></div>
      </div>
    </div>

    <main class="auth-shell">
      <img class="auth-brand-logo" src="assets/images/logo.png" alt="Interaktik" />
      <section class="auth-card">
        <h1>Olvide mi contrasena</h1>
        <p class="muted">Escribe tu correo y te enviaremos un enlace para restablecer tu contrasena.</p>

        <form id="forgotPasswordForm">
          <label>
            Correo electronico
            <input name="email" type="email" required />
          </label>
          <button type="submit">Enviar enlace de recuperacion</button>
          <p id="authMessage" class="message" aria-live="polite"></p>
        </form>

        <p class="muted"><a href="login.html">Volver a iniciar sesion</a></p>
      </section>
    </main>
    <script src="js/config.js?v=20260606c"></script>
    <script src="js/runtime.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/bg-effects.js"></script>
    <script src="js/forgot-password.js"></script>
    <script>window.addEventListener('DOMContentLoaded', () => initBackgroundEffects('.auth-card'));</script>
  </body>
</html>
