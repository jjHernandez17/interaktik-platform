<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesion | PlayTik Live</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="assets/css/design-system.css" />
    <link rel="stylesheet" href="assets/css/auth.css?v=20260830a" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <h1>Iniciar sesion</h1>
        <p class="muted">Accede a tu panel de juegos interactivos.</p>
        <form id="authForm" data-mode="login">
          <label>
            Correo electronico
            <input name="email" type="email" required />
          </label>
          <label>
            Contrasena
            <input name="password" type="password" minlength="6" required />
          </label>
          <button type="submit">Entrar</button>
          <p id="authMessage" class="message" aria-live="polite"></p>
        </form>
        <p class="muted">No tienes cuenta? <a href="register.html">Registrate</a></p>
      </section>
    </main>
    <script src="js/config.js?v=20260606c"></script>
    <script src="js/runtime.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
