<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay: Alerta de nuevo seguidor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #followAlertRoot {
      position: fixed;
      left: 50%;
      bottom: 6%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 28px 16px 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(251, 146, 60, 0.92), rgba(244, 63, 94, 0.88));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    #followAlertRoot.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      animation: follow-alert-pop 260ms ease;
    }

    @keyframes follow-alert-pop {
      0% { transform: translateX(-50%) translateY(24px) scale(0.92); opacity: 0; }
      60% { transform: translateX(-50%) translateY(-4px) scale(1.02); opacity: 1; }
      100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    }

    #followAlertAvatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.25);
      border: 3px solid #fff;
      flex: 0 0 auto;
    }

    #followAlertText {
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    #followAlertName {
      font-weight: 800;
      font-size: 1.15rem;
      margin: 0 0 2px;
    }

    #followAlertDetail {
      font-weight: 600;
      font-size: 0.98rem;
      margin: 0;
      opacity: 0.95;
    }
  </style>
</head>

<body>
  <div id="followAlertRoot">
    <img id="followAlertAvatar" src="" alt="" />
    <div id="followAlertText">
      <p id="followAlertName"></p>
      <p id="followAlertDetail">empezó a seguirte ✨</p>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/runtime.js"></script>
  <script src="../js/overlay-sounds.js"></script>
  <script src="../js/overlay-demo-avatar.js"></script>
  <script src="../js/overlay-follow-alert.js"></script>
</body>

</html>
