<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay: Ruleta</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #rouletteRoot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2% 3%;
      box-sizing: border-box;
      gap: 1.5vmin;
    }

    #rouletteRoot[hidden] {
      display: none;
    }

    #rouletteTitle {
      flex: none;
      max-width: 100%;
      margin: 0;
      padding: 0.5vmin 3vmin;
      border-radius: 999px;
      background: rgba(8, 12, 22, 0.78);
      color: #fff;
      font-size: clamp(14px, 4.2vmin, 54px);
      font-weight: 800;
      letter-spacing: 0.01em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #rouletteTitle:empty {
      display: none;
    }

    #wheelStage {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: grid;
      place-items: center;
    }

    #wheelCanvas {
      display: block;
    }

    /* Resultado: tarjeta sobre la parte baja de la rueda. El ganador siempre
       queda arriba (bajo la flecha), así que no tapa nada importante, y al ir
       en posición absoluta la rueda nunca cambia de tamaño al mostrarla. */
    #rouletteResult {
      position: absolute;
      left: 50%;
      bottom: 4%;
      max-width: 92%;
      display: grid;
      justify-items: center;
      gap: 0.4vmin;
      padding: 1.6vmin 3.5vmin;
      border-radius: 2.4vmin;
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.95), rgba(34, 211, 238, 0.92));
      color: #fff;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      box-shadow: 0 1.5vmin 5vmin rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #rouletteResult.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #resultLabel {
      margin: 0;
      font-size: clamp(16px, 6vmin, 72px);
      font-weight: 900;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    #resultDetail {
      margin: 0;
      font-size: clamp(11px, 2.6vmin, 30px);
      font-weight: 600;
      opacity: 0.95;
    }

    #resultDetail:empty {
      display: none;
    }

    /* Vista previa embebida en el panel (?demo=1): sin margenes grandes. */
    body.preview-mode #rouletteRoot {
      padding: 1.5% 2%;
      gap: 0.8vmin;
    }
  </style>
</head>

<body>
  <script>
    if (new URLSearchParams(location.search).get('demo') === '1') {
      document.body.classList.add('preview-mode');
    }
  </script>

  <div id="rouletteRoot">
    <h1 id="rouletteTitle"></h1>
    <div id="wheelStage">
      <canvas id="wheelCanvas" aria-label="Ruleta"></canvas>
    </div>
    <div id="rouletteResult" aria-live="polite">
      <p id="resultLabel"></p>
      <p id="resultDetail"></p>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/runtime.js"></script>
  <script src="../js/overlay-sounds.js"></script>
  <script src="../js/overlay-demo-avatar.js"></script>
  <script src="../js/overlay-roulette.js"></script>
</body>

</html>
