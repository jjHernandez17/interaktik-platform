<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay: Top de regaladores</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #topGiftersRoot {
      position: fixed;
      top: 6%;
      right: 4%;
      width: min(85vw, 320px);
      padding: 16px 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.75));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 300ms ease;
    }

    #topGiftersRoot.visible {
      opacity: 1;
    }

    #topGiftersTitle {
      font-weight: 800;
      font-size: 1rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #topGiftersList {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-gifter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
    }

    .top-gifter-row:nth-child(1) {
      background: linear-gradient(90deg, rgba(250, 204, 21, 0.25), rgba(255, 255, 255, 0.06));
    }

    .top-gifter-rank {
      font-weight: 800;
      font-size: 0.85rem;
      width: 20px;
      text-align: center;
      opacity: 0.85;
    }

    .top-gifter-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      object-fit: cover;
      flex-shrink: 0;
    }

    .top-gifter-name {
      flex: 1;
      font-weight: 700;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-gifter-coins {
      font-weight: 800;
      font-size: 0.85rem;
      color: #facc15;
      white-space: nowrap;
    }

    #topGiftersEmpty {
      font-size: 0.85rem;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div id="topGiftersRoot">
    <div id="topGiftersTitle">🏆 <span id="topGiftersTitleText">Top Regaladores</span></div>
    <div id="topGiftersList"></div>
    <p id="topGiftersEmpty">Todavía no hay regalos en esta transmisión.</p>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/runtime.js"></script>
  <script src="../js/overlay-demo-avatar.js"></script>
  <script src="../js/overlay-top-gifters.js"></script>
</body>

</html>
