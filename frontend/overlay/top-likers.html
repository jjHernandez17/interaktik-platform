<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay: Top de likes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #topLikersRoot {
      position: fixed;
      top: 6%;
      left: 4%;
      width: min(85vw, 320px);
      padding: 16px 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.75));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 300ms ease;
    }

    #topLikersRoot.visible {
      opacity: 1;
    }

    #topLikersTitle {
      font-weight: 800;
      font-size: 1rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #topLikersList {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-liker-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
    }

    .top-liker-row:nth-child(1) {
      background: linear-gradient(90deg, rgba(251, 113, 133, 0.28), rgba(255, 255, 255, 0.06));
    }

    .top-liker-rank {
      font-weight: 800;
      font-size: 0.85rem;
      width: 20px;
      text-align: center;
      opacity: 0.85;
    }

    .top-liker-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      object-fit: cover;
      flex-shrink: 0;
    }

    .top-liker-name {
      flex: 1;
      font-weight: 700;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-liker-count {
      font-weight: 800;
      font-size: 0.85rem;
      color: #fb7185;
      white-space: nowrap;
    }

    #topLikersEmpty {
      font-size: 0.85rem;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div id="topLikersRoot">
    <div id="topLikersTitle">❤️ <span id="topLikersTitleText">Top Likes</span></div>
    <div id="topLikersList"></div>
    <p id="topLikersEmpty">Todavía no hay likes en esta transmisión.</p>
  </div>

  <script src="../js/overlay-top-likers.js"></script>
</body>

</html>
