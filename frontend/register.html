<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | PlayTik Live</title>
    <link rel="stylesheet" href="assets/css/design-system.css" />
    <link rel="stylesheet" href="assets/css/auth.css?v=20260830a" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <h1>Crear cuenta</h1>
        <p class="muted">Comienza a construir juegos para tus lives de TikTok.</p>
        <form id="authForm" data-mode="register">
          <label>
            Nombre
            <input name="name" type="text" required />
          </label>
          <label>
            Correo electronico
            <input name="email" type="email" required />
          </label>
          <label>
            Contrasena
            <input name="password" id="passwordInput" type="password" minlength="6" required />
          </label>
          <label>
            Confirmar contrasena
            <input name="passwordConfirm" id="passwordConfirmInput" type="password" minlength="6" required />
          </label>
          <ul id="passwordRules" class="password-rules">
            <li data-rule="length">Minimo 6 caracteres</li>
            <li data-rule="lower">Una minuscula</li>
            <li data-rule="upper">Una mayuscula</li>
            <li data-rule="number">Un numero</li>
            <li data-rule="special">Un caracter especial</li>
            <li data-rule="match">Las contrasenas coinciden</li>
          </ul>
          <button type="submit" id="submitBtn" disabled>Registrarme</button>
          <p id="authMessage" class="message" aria-live="polite"></p>
        </form>
        <p class="muted">Ya tienes cuenta? <a href="login.html">Inicia sesion</a></p>
      </section>
    </main>
    <script src="js/config.js?v=20260606c"></script>
    <script src="js/runtime.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
