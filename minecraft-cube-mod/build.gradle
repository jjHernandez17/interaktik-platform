plugins {
    id 'fabric-loom' version '1.9.2'
}

version = project.mod_version
group = 'com.interaktik'

base {
    archivesName = 'InteraktikCubo'
}

repositories {
    // el resto de dependencias (Minecraft, Fabric) las resuelve Loom
}

// Los modulos de Fabric API que usa el mod (eventos del servidor y registro de comandos) van
// DENTRO del .jar ("include"): asi el usuario no tiene que descargar Fabric API aparte.
// Si ademas tiene Fabric API instalado, Fabric Loader usa la version mas nueva de cada modulo.
def bundledModules = [
        'fabric-api-base',
        'fabric-lifecycle-events-v1',
        'fabric-command-api-v2',
        'fabric-events-interaction-v0',
        'fabric-networking-api-v1',
        'fabric-key-binding-api-v1',
]

loom {
    // permite quitar la pausa entre un bloque y el siguiente al colocar (Minecraft.rightClickDelay)
    accessWidenerPath = file('src/main/resources/interaktik_cubo.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    bundledModules.each { module ->
        modImplementation fabricApi.module(module, project.fabric_version)
        include fabricApi.module(module, project.fabric_version)
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
